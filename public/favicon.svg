<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>ANAM[QR]PHIC - 3D Printable Voxel Diorama QR code</title>
  <desc>A QR finder pattern on a gold tile, with one module lifted clear of the plate.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE047"/>
      <stop offset=".55" stop-color="#FACC15"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- gold tile, matching the in-app brand badge -->
  <rect width="64" height="64" rx="14" fill="url(#gold)"/>

  <!-- a QR finder pattern: the one mark that reads instantly at 16px -->
  <path d="M15 15h34v34H15z" fill="none" stroke="#0B0F1E" stroke-width="7"/>
  <rect x="27" y="27" width="10" height="10" fill="#0B0F1E"/>

  <!-- one module lifted clear of the plate: the anamorphic tilt -->
  <rect x="43" y="6" width="9" height="9" rx="1.5" fill="#0B0F1E" opacity=".55"/>
</svg>
